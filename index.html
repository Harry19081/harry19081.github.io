  <script>
    ;(function () {
      var stored = null
      try { stored = localStorage.getItem('theme') } catch {}
      var theme = stored === 'light' || stored === 'dark'
        ? stored
        : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      document.documentElement.dataset.theme = theme

      // SPA deep links on GitHub Pages: 404.html stashes the requested path
      // in sessionStorage and redirects here; restore it before React mounts.
      try {
        var redirect = sessionStorage.redirect
        delete sessionStorage.redirect
        if (redirect && redirect !== location.pathname + location.search + location.hash) {
          history.replaceState(null, '', redirect)
        }
      } catch {}
    })()
  </script>
